# docker-compose.yml

services:
  # ---- ChromaDB (Vector Database) ----
  chromadb:
    image: ghcr.io/chroma-core/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - rag-network

  # ---- Backend (FastAPI) ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GDRIVE_ROOT_FOLDER_ID=${GDRIVE_ROOT_FOLDER_ID}
      - ENABLE_AI_SECURITY_LAYER=${ENABLE_AI_SECURITY_LAYER:-true}
      - USE_RERANKER=${USE_RERANKER:-true}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - HF_HOME=/app/.cache/huggingface
    volumes:
      - huggingface_cache:/app/.cache/huggingface
      - ./backend/gdrive_credentials.json:/app/gdrive_credentials.json:ro
    depends_on:
      - chromadb
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- Frontend (React) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - rag-network
    restart: unless-stopped

volumes:
  chroma_data:
  huggingface_cache:

networks:
  rag-network:
    driver: bridge
