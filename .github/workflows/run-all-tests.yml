name: Run All Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest requests uvicorn pytest-cov

      - name: Start the app (with explicit collection)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} \
          QDRANT_URL: ${{ secrets.QDRANT_URL }} \
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }} \
          COLLECTION_NAME: ${{ secrets.COLLECTION_NAME }} \
        run: |
          echo "Starting app with collection: $QDRANT_COLLECTION"
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 15
          curl -f http://localhost:8000/api/v1/health || exit 1
          echo "✅ App is running on localhost:8000"

      - name: Run tests (skip retriever integration)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          pytest tests/ \
            --ignore=tests/test_retriever.py \
            -v --tb=short --cov=app --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 30

      - name: Stop the app
        if: always()
        run: |
          pkill -f uvicorn || true
